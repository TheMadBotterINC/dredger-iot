AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - 'bin/setup'
    - 'bin/console'
    - 'pkg/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
  SuggestExtensions: false

plugins:
  - rubocop-rspec
  - rubocop-performance
  - rubocop-rake

Layout/LineLength:
  Max: 120
  Exclude:
    - 'lib/dredger/iot/sensors/*_provider.rb'

Metrics/ClassLength:
  Exclude:
    - 'bin/dredger'

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'lib/dredger/iot/sensors/*_provider.rb'
    - 'bin/dredger'
    - 'spec/**/*'

RSpec:
  Language:
    Expect: expect

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/SpecFilePathFormat:
  CustomTransform:
    IoT: iot
    I2C: i2c
    GPIO: gpio
    BME280: bme280
    BMP180: bmp180
    DHT22: dht22
    DS18B20: ds18b20
    DS18B20Provider: ds18b20_provider
    MCP9808: mcp9808
    SHT31: sht31
    BH1750: bh1750
    TSL2561: tsl2561
    INA219: ina219
    ADXL345: adxl345
    SCD30: scd30
    YFS201: yf_s201
    NEO6M: neo6m
    NEO6MProvider: neo6m_provider
    YFS201Provider: yf_s201_provider

Metrics/BlockLength:
  Exclude:
    - 'examples/**/*'
    - 'bin/dredger'

Metrics/AbcSize:
  Exclude:
    - 'lib/dredger/iot/sensors/*_provider.rb'
    - 'bin/dredger'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/dredger/iot/sensors/*_provider.rb'
    - 'bin/dredger'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/dredger/iot/sensors/*_provider.rb'
    - 'bin/dredger'

RSpec/MessageSpies:
  Enabled: false
